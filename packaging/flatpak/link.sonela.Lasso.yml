# Lasso - Flatpak manifest DRAFT (not built or tested yet).
# Local test build (from the repo root):
#   flatpak run org.flatpak.Builder --user --install --force-clean --install-deps-from=flathub build-dir packaging/flatpak/link.sonela.Lasso.yml
#   flatpak run link.sonela.Lasso
# Before Flathub: replace the `type: dir` source with the public repo (type: git, url https://github.com/Resister0/lasso.git,
# tag + commit) and add vendored crates (flatpak-cargo-generator.py Cargo.lock -> cargo-sources.json, then build offline).
#
# OPEN QUESTIONS (check on a real KDE + GNOME desktop):
#  - KWin only answers org.kde.KWin.ScreenShot2 for a program whose installed .desktop file lists it in
#    X-KDE-DBUS-Restricted-Interfaces. Inside the sandbox the exported desktop file (/var/lib/flatpak/exports) may or may
#    not count - if not, the Flatpak must fall back to the xdg-desktop-portal Screenshot portal (slower: no instant freeze).
#  - Layer-shell overlay needs the Wayland socket only; --talk-name=org.kde.KWin lets it ask KWin for the window list.
id: link.sonela.Lasso
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: lasso

finish-args:
  - --share=ipc
  - --share=network                       # share links (later)
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-pictures/Lasso:create # saved screenshots
  - --talk-name=org.kde.KWin               # ScreenShot2 + window list + scripting
  - --talk-name=org.kde.StatusNotifierWatcher  # tray icon
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.FileManager1   # "Show in folder"
  - --talk-name=org.freedesktop.portal.Desktop # GlobalShortcuts, file chooser, screenshot fallback

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/lasso/cargo

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man

modules:
  - name: lasso
    buildsystem: simple
    build-commands:
      - cargo build --release --offline --verbose
      - install -Dm755 target/release/lasso /app/bin/lasso
      - install -Dm644 packaging/link.sonela.Lasso.desktop /app/share/applications/link.sonela.Lasso.desktop
      - install -Dm644 packaging/link.sonela.Lasso.metainfo.xml /app/share/metainfo/link.sonela.Lasso.metainfo.xml
      - install -Dm644 packaging/icons/hicolor/scalable/apps/link.sonela.Lasso.svg /app/share/icons/hicolor/scalable/apps/link.sonela.Lasso.svg
      - for s in 16 24 32 48 64 128 256 512; do install -Dm644 packaging/icons/hicolor/${s}x${s}/apps/link.sonela.Lasso.png /app/share/icons/hicolor/${s}x${s}/apps/link.sonela.Lasso.png; done
    sources:
      - type: dir
        path: ../..
      # - type: file          # generated by flatpak-cargo-generator.py
      #   path: cargo-sources.json
